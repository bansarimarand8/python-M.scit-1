<!DOCTYPE html>
<html>
<head>
    <title>Update Task</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            margin: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            background: green;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
        }

        a {
            margin-left: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Update Task</h1>

    <form action="/update/{{ task['id'] }}" method="POST">

        <label>Title</label>

        <input type="text"
               name="title"
               value="{{ task['title'] }}"
               maxlength="150"
               required>


        <label>Description</label>

        <textarea name="description"
                  maxlength="300">{{ task['description'] }}</textarea>


        <label>Priority</label>

        <select name="priority">

            <option value="High"
                {% if task['priority'] == 'High' %}selected{% endif %}>
                High
            </option>

            <option value="Medium"
                {% if task['priority'] == 'Medium' %}selected{% endif %}>
                Medium
            </option>

            <option value="Low"
                {% if task['priority'] == 'Low' %}selected{% endif %}>
                Low
            </option>

        </select>


        <label>Due Date</label>

        <input type="date"
       name="due_date"
       value="{{ task['due_date'] }}"
       min="{{ today }}"
       required>


        <button type="submit">
            Update Task
        </button>

        <a href="/">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
