<!DOCTYPE html>
<html>
<head>
    <title>To Do List</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }

        h1 {
            text-align: center;
        }

        form {
            text-align: center;
            margin-bottom: 30px;
        }

        input, select, button {
            padding: 8px;
            margin: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightgray;
        }

        .delete {
            color: red;
        }
    </style>
</head>

<body>

<h1>My To-Do List</h1>

<form action="/add" method="POST">

    <input type="text"
           name="task_name"
           placeholder="Task Name"
           required>

    <input type="date"
           name="task_date"
           required>

    <input type="time"
           name="from_time"
           required>

    <input type="time"
           name="to_time"
           required>

    <select name="status">
        <option value="Pending">Pending</option>
        <option value="Completed">Completed</option>
    </select>

    <button type="submit">Add Task</button>

</form>


<table>

    <tr>
        <th>ID</th>
        <th>Task Name</th>
        <th>Date</th>
        <th>From</th>
        <th>To</th>
        <th>Status</th>
        <th>Action</th>
    </tr>

    {% for task in tasks %}

    <tr>
        <td>{{ task.id }}</td>

        <td>{{ task.task_name }}</td>

        <td>{{ task.task_date }}</td>

        <td>{{ task.from_time }}</td>

        <td>{{ task.to_time }}</td>

        <td>{{ task.status }}</td>

        <td>
            <a class="delete"
               href="/delete/{{ task.id }}">
               Delete
            </a>
        </td>
    </tr>

    {% endfor %}

</table>

</body>
</html>
